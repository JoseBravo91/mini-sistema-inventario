<h2>Historial de movimientos</h2>

@if (cargando()) {
  <div class="centrado">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <ag-grid-angular
    class="ag-theme-quartz tabla-grid"
    [theme]="'legacy'"
    [rowData]="movimientos()"
    [columnDefs]="columnas"
    [defaultColDef]="configuracionPorDefecto"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[5, 10, 25, 50]"
    [animateRows]="true"
  ></ag-grid-angular>
}
