<div class="encabezado">
  <h2>Inventario actual</h2>
  <button mat-icon-button (click)="cargarInventario()" matTooltip="Actualizar" aria-label="Actualizar inventario">
    <mat-icon>refresh</mat-icon>
  </button>
</div>

@if (cargando()) {
  <div class="centrado">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else {
  <ag-grid-angular
    class="ag-theme-quartz tabla-grid"
    [theme]="'legacy'"
    [rowData]="inventario()"
    [columnDefs]="columnas"
    [defaultColDef]="configuracionPorDefecto"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[5, 10, 25, 50]"
    [animateRows]="true"
  ></ag-grid-angular>
}
