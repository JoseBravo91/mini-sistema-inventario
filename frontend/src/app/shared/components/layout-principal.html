<mat-sidenav-container class="contenedor">
  <mat-sidenav mode="side" opened class="menu-lateral">
    <mat-nav-list>
      <a mat-list-item routerLink="/inventario" routerLinkActive="activo">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Inventario</span>
      </a>
      <a mat-list-item routerLink="/productos" routerLinkActive="activo">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a mat-list-item routerLink="/movimientos/entrada" routerLinkActive="activo">
        <mat-icon matListItemIcon>call_received</mat-icon>
        <span matListItemTitle>Registrar entrada</span>
      </a>
      <a mat-list-item routerLink="/movimientos/salida" routerLinkActive="activo">
        <mat-icon matListItemIcon>call_made</mat-icon>
        <span matListItemTitle>Registrar salida</span>
      </a>
      <a mat-list-item routerLink="/movimientos/historial" routerLinkActive="activo">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle>Historial</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Gestion de Inventario</span>
      <span class="espaciador"></span>
      @if (usuario) {
        <span class="usuario-info">{{ usuario.nombreCompleto }}</span>
        <button mat-icon-button (click)="cerrarSesion()" aria-label="Cerrar sesion" matTooltip="Cerrar sesion">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </mat-toolbar>

    <div class="contenido">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
